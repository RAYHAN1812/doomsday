services:
  - type: web
    name: doomsday-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true"

  - type: web
    name: doomsday-web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_SCHEME
        value: https
      - key: API_HOST
        sync: false
