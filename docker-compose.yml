services:
  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: "10000"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in the root .env file}"
      SEED_SAMPLE_DATA: "${SEED_SAMPLE_DATA:-true}"
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "8080:80"
    environment:
      API_URL: http://api:10000
      PORT: "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
