services:
  api:
    build: ./server
    environment:
      SEED_SAMPLE_DATA: "true"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
